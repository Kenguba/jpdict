plugins { id 'com.android.application' }

def ciVersionCode = System.getenv('VERSION_CODE')
def ciVersionName = System.getenv('VERSION_NAME')
def releaseStorePath = System.getenv('ANDROID_KEYSTORE_PATH')
def releaseStorePassword = System.getenv('ANDROID_KEYSTORE_PASSWORD')
def releaseKeyAlias = System.getenv('ANDROID_KEY_ALIAS')
def releaseKeyPassword = System.getenv('ANDROID_KEY_PASSWORD')
def quoteBuildConfig = { String value ->
    return '"' + value.replace('\\', '\\\\').replace('"', '\\"') + '"'
}

android {
    namespace 'com.yuen.jpdict'
    compileSdk 35

    defaultConfig {
        applicationId "com.yuen.jpdict"
        minSdk 23
        targetSdk 35
        versionCode ciVersionCode ? ciVersionCode.toInteger() : 4
        versionName ciVersionName ?: "0.4.0"

        buildConfigField "String", "GROQ_BASE_URL", quoteBuildConfig("https://api.groq.com/openai/v1")
        buildConfigField "String", "GROQ_MODEL", quoteBuildConfig("openai/gpt-oss-20b")
    }

    buildFeatures {
        buildConfig true
    }

    flavorDimensions "abi"

    productFlavors {
        universal {
            dimension "abi"
        }

        arm {
            dimension "abi"
            ndk {
                abiFilters "arm64-v8a", "armeabi-v7a"
            }
        }

        arm64 {
            dimension "abi"
            ndk {
                abiFilters "arm64-v8a"
            }
        }

        armv7 {
            dimension "abi"
            ndk {
                abiFilters "armeabi-v7a"
            }
        }
    }

    signingConfigs {
        release {
            if (releaseStorePath && releaseStorePassword && releaseKeyAlias && releaseKeyPassword) {
                storeFile file(releaseStorePath)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }

        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Use Google Play services OCR models to support English/Latin, Chinese and Japanese
    // without bundling three large recognition models into the APK.
    implementation 'com.google.android.gms:play-services-mlkit-text-recognition:19.0.1'
    implementation 'com.google.android.gms:play-services-mlkit-text-recognition-chinese:16.0.1'
    implementation 'com.google.android.gms:play-services-mlkit-text-recognition-japanese:16.0.1'
    implementation 'com.google.android.gms:play-services-mlkit-text-recognition-korean:16.0.1'
}
