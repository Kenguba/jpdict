name: Build jpdict APK

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      stage:
        description: Release stage
        required: true
        default: B
        type: choice
        options:
          - A
          - D
          - B
          - T
          - C
          - R
          - P
          - H

permissions:
  contents: write

concurrency:
  group: jpdict-versioned-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Enforce tracked source size budget
        shell: bash
        run: |
          MAX_BYTES=$((35 * 1024 * 1024))
          TOTAL_BYTES=$(git ls-files -z | xargs -0 -r stat -c '%s' | awk '{sum += $1} END {print sum + 0}')
          echo "Tracked project size: $TOTAL_BYTES bytes / $MAX_BYTES bytes"
          if (( TOTAL_BYTES > MAX_BYTES )); then
            echo "::error::Tracked project files exceed the 35 MB hard limit."
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify floating search interaction state
        run: sh scripts/test-floating-search-state.sh

      - name: Verify independent MDX/MDD parser and query scheduler
        run: sh scripts/test-mdict.sh

      - name: Install Android command-line tools
        shell: bash
        run: |
          SDK="$RUNNER_TEMP/android-sdk"
          mkdir -p "$SDK/cmdline-tools"
          curl -fsSL -o /tmp/cmdline.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdline.zip -d "$SDK/cmdline-tools"
          mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set build version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_STAGE: ${{ github.event.inputs.stage || 'R' }}
        run: |
          python3 scripts/allocate-build-version.py \
            --date "$(TZ=Asia/Shanghai date +'%y.%m.%d')" \
            --stage "$BUILD_STAGE" \
            --run-number "$GITHUB_RUN_NUMBER"

      - name: Guard vivo system-bar compatibility
        shell: bash
        run: |
          if grep -R -n -E 'WindowInsetsController|getInsetsController\(' app/src/main/java; then
            echo "::error::Unsupported WindowInsetsController path reintroduced; this crashes QuickLookupActivity on the target vivo/OriginOS device."
            exit 1
          fi

      - name: Check Android compatibility with Lint
        run: >-
          gradle --no-daemon
          :app:lintArmDebug
          :app:lintArm64Debug
          :app:lintArmv7Debug

      - name: Detect release signing secrets
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -n "$KEYSTORE_B64" && -n "$STORE_PASS" && -n "$KEY_ALIAS" && -n "$KEY_PASS" ]]; then
            echo "HAS_SIGNING=true" >> "$GITHUB_ENV"
            echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/jpdict-release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/jpdict-release.jks" >> "$GITHUB_ENV"
          else
            echo "HAS_SIGNING=false" >> "$GITHUB_ENV"
            echo "::warning::Release signing secrets are not configured. Building debug artifacts only; no GitHub Release will be published."
          fi

      - name: Build signed Release APKs
        if: env.HAS_SIGNING == 'true'
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          gradle --no-daemon \
            :app:assembleArmRelease \
            :app:assembleArm64Release \
            :app:assembleArmv7Release

      - name: Build fallback debug APKs
        if: env.HAS_SIGNING != 'true'
        shell: bash
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          gradle --no-daemon \
            :app:assembleArmDebug \
            :app:assembleArm64Debug \
            :app:assembleArmv7Debug

      - name: Verify floating bubble configuration and history
        shell: bash
        run: |
          if [[ "$HAS_SIGNING" == 'true' ]]; then
            sh scripts/test-floating-bubble-config.sh arm64Release
          else
            sh scripts/test-floating-bubble-config.sh arm64Debug
          fi

      - name: Prepare signed APK files
        if: env.HAS_SIGNING == 'true'
        shell: bash
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/arm/release/app-arm-release.apk "dist/jpdict-${VERSION_NAME}-arm.apk"
          cp app/build/outputs/apk/arm64/release/app-arm64-release.apk "dist/jpdict-${VERSION_NAME}-arm64-v8a.apk"
          cp app/build/outputs/apk/armv7/release/app-armv7-release.apk "dist/jpdict-${VERSION_NAME}-armeabi-v7a.apk"

      - name: Prepare fallback debug APK files
        if: env.HAS_SIGNING != 'true'
        shell: bash
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/arm/debug/app-arm-debug.apk "dist/jpdict-${VERSION_NAME}-arm-UNSIGNED-DEBUG.apk"
          cp app/build/outputs/apk/arm64/debug/app-arm64-debug.apk "dist/jpdict-${VERSION_NAME}-arm64-v8a-UNSIGNED-DEBUG.apk"
          cp app/build/outputs/apk/armv7/debug/app-armv7-debug.apk "dist/jpdict-${VERSION_NAME}-armeabi-v7a-UNSIGNED-DEBUG.apk"

      - name: Enforce APK size budget
        shell: bash
        run: |
          MAX_BYTES=$((30 * 1024 * 1024))
          FAILED=0
          shopt -s nullglob
          APKS=(dist/*.apk)
          if (( ${#APKS[@]} == 0 )); then
            echo "::error::No APK files were prepared."
            exit 1
          fi
          for apk in "${APKS[@]}"; do
            SIZE=$(stat -c '%s' "$apk")
            echo "$(basename "$apk"): $SIZE bytes / $MAX_BYTES bytes"
            if (( SIZE > MAX_BYTES )); then
              echo "::error file=$apk::APK exceeds the 30 MB hard limit."
              FAILED=1
            fi
          done
          exit "$FAILED"

      - name: Verify release identity and signatures
        if: env.HAS_SIGNING == 'true'
        shell: bash
        run: |
          EXPECTED_CERT=cb8b97989bfe7894e796842ce5b2e3e3b2aab48aa7f0f7a97c1ece04ac184252
          PUBLIC_CERT=$(openssl x509 -in signing/jpdict-release-cert.pem -noout -fingerprint -sha256 | cut -d= -f2 | tr -d ':' | tr '[:upper:]' '[:lower:]')
          if [[ "$PUBLIC_CERT" != "$EXPECTED_CERT" ]]; then
            echo "::error::Public release certificate does not match the fixed signing identity."
            exit 1
          fi
          for apk in dist/*.apk; do
            SIGNATURE=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$apk")
            APK_CERT=$(sed -n 's/^Signer #[0-9][0-9]* certificate SHA-256 digest: //p' <<< "$SIGNATURE" | tr '[:upper:]' '[:lower:]')
            if [[ "$APK_CERT" != "$EXPECTED_CERT" ]]; then
              echo "::error file=$apk::APK is signed with a different release certificate."
              exit 1
            fi
            PACKAGE=$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | sed -n '/^package: /p')
            if [[ "$PACKAGE" != *"name='com.yuen.jpdict'"* || "$PACKAGE" != *"versionCode='$VERSION_CODE'"* || "$PACKAGE" != *"versionName='$VERSION_NAME'"* ]]; then
              echo "::error file=$apk::APK package/version does not match the allocated build version."
              exit 1
            fi
            echo "Verified $(basename "$apk"): $VERSION_NAME (versionCode=$VERSION_CODE), fixed release certificate."
          done

      - name: Create SHA-256 checksums
        shell: bash
        run: |
          sha256sum dist/*.apk | tee dist/SHA256SUMS.txt
          ls -lh dist/*.apk

      - name: Upload signed Actions artifact
        if: env.HAS_SIGNING == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: jpdict-signed-build-${{ github.run_number }}
          path: |
            dist/*.apk
            dist/SHA256SUMS.txt

      - name: Upload fallback debug artifact
        if: env.HAS_SIGNING != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: jpdict-unsigned-debug-build-${{ github.run_number }}
          path: |
            dist/*.apk
            dist/SHA256SUMS.txt

      - name: Create Release notes
        if: env.HAS_SIGNING == 'true'
        shell: bash
        run: |
          {
            echo "## 版本"
            echo
            echo "- Version: \`$VERSION_NAME\`"
            echo "- versionCode: \`$VERSION_CODE\`"
            echo "- 固定签名证书 SHA-256: \`CB:8B:97:98:9B:FE:78:94:E7:96:84:2C:E5:B2:E3:E3:B2:AA:B4:8A:A7:F0:F7:A9:7C:1E:CE:04:AC:18:42:52\`"
            echo
            cat <<'EOF'
          ## 词库功能与兼容范围

          - 词库管理改为紧凑书本卡片和列表内单卡展开，按名称生成柔和图标颜色并保证白字可读，收细书页和六点手柄、开关白点内收；卡片无阴影、隐藏滚动条。
          - 长按排序提供抬起缩放、占位、平滑让位和松手吸附；取消返回原位，筛选排序保留隐藏词库位置。
          - 文件管理之后的第四项改为“查词展开”，默认关闭；安装记录升级、替换安装及完整/轻量备份保留设置。浏览词库支持有界词表分页与本词库释义。
          - 顶部“设置”改为“历史记录”，打开抽屉查看已保存搜索记录；抽屉历史查词保留原搜索页面、抽屉和滚动位置，查词遮罩覆盖原页面，手势返回不再重建搜索或关闭抽屉。
          - 词库存储选择框采用紧凑圆角、小字号和收紧留白，点击遮罩关闭，移除“取消”；联想词移到输入框上方并分行，快捷入口移到下方。
          - 主页面水印换成书本，输入框默认加高到两行；输入区记忆实测键盘高度并持续预留，键盘显隐保持位置；键盘上方输入区支持横滑控制抽屉，系统输入法按键区不拦截。
          - 修复 OALDPE MDD 尾部追加 nginx 416 下载错误页导致的导入失败；只接受完整且已确认的短错误页，仍验证全部词库块，拒绝未知尾部和损坏文件。
          - 设置标题加粗；查词工具栏依次为收藏、重播、词典列表、更多；词头长按 700ms 编辑，发音随正文滚动，词库分区随内容增减高度。
          - 悬浮搜索空输入框自动填入两分钟内的可读剪贴板文字；输入卡片上方提供本地词库候选；正文及输入区呼出抽屉，修复抬手前丢失速度采样的问题。
          - 自研 Java MDX/MDD v1/v2 引擎，支持 raw、zlib、LZO1X v0、跨块记录和词条重定向。
          - 支持本地 SAF 导入、内部副本/外部关联、分卷资源、开关排序、悬浮和 Activity 查词，以及完整/轻量备份恢复。
          - 修复 `Compact/Compat=Yes` 且 `StyleSheet` 为空的普通 HTML 词库误拒绝，以及规范化索引摘要与原词头不同导致的误拒绝；保留原词头精确匹配。
          - 支持词库引用的本地 JavaScript、CSS、字体和子目录，兼容 src/、mdd/ 解包资源；每本词库独立 Origin，本地响应头 CSP 与网络阻断保持资源隔离，无 Android Bridge。
          - 修复大小写别名 `@@@LINK` 的误循环；导入即保存辅助索引，加入有界过滤摘要减少重叠范围下的无关解压。
          - MDD 支持 16 MB 字体块，外部资源按流读取（32 MB 上限）；文件夹可选择需要的 MDX，并自动搭配同名/编号 MDD 和资源。
          - 设置顶部改为词库管理入口，保留关于按钮，去掉重复入口和“词典”分组小字。
          - 本地样本“日语单词总汇”的 my 正文为动态占位，所配 workClick.js 缺少内容生成逻辑，LINK 修复后仍为空白，需要补齐该词库的浏览器脚本和数据。
          - 保留 v2 `Encrypted=2` 索引读取，兼容使用这一标记的 MDX 和 MDD；独立实现校验和派生索引解码，无新增依赖。
          - 下载页当前为示例目录，不提供真实下载。v3、密码保护（`Encrypted=1/3`）、v1 索引混淆、非空 `StyleSheet` 的 Compact 样式替换尚不支持；有限本地词库验证不代表全部商业词库兼容，OriginOS 实机仍待验证。

          ## APK 架构说明

          这里的 v7、v8 指的是 Android 设备的 CPU 指令集架构（ABI），不是 Android 系统版本。

          | ABI | 简称 | 位数 | 主要设备 / 用途 |
          | --- | --- | --- | --- |
          | `armeabi-v7a` | v7 | 32 位 | 老 Android 手机、旧平板 |
          | `arm64-v8a` | v8 | 64 位 | 现在绝大多数 Android 手机 |
          | `x86` | x86 | 32 位 | 老模拟器、少量旧设备 |
          | `x86_64` | x86_64 | 64 位 | 模拟器、部分 Chromebook / 特殊设备 |

          ## 下载哪个 APK

          - **jpdict-<版本>-arm64-v8a.apk**：只包含 `arm64-v8a`，推荐现在绝大多数 Android 手机使用。
          - **jpdict-<版本>-armeabi-v7a.apk**：只包含 `armeabi-v7a`，适合老旧 32 位 ARM 手机和平板。
          - **jpdict-<版本>-arm.apk**：包含 `arm64-v8a + armeabi-v7a`，手机通用集合版。

          为遵守单 APK 不超过 30 MB 的硬限制，当前不发布 universal APK。x86 / x86_64 如需支持，应改为分架构产物，不能通过超大 universal APK 绕过体积限制。

          ## SHA-256

          下载附件中的 `SHA256SUMS.txt` 可以校验 APK 完整性。
          EOF
          } > release-notes.md

      - name: Publish signed GitHub Release
        if: env.HAS_SIGNING == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="$VERSION_NAME"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              dist/*.apk \
              dist/SHA256SUMS.txt \
              --clobber

            gh release edit "$TAG" \
              --title "jpdict $VERSION_NAME" \
              --notes-file release-notes.md
          else
            gh release create "$TAG" \
              dist/*.apk \
              dist/SHA256SUMS.txt \
              --target "$GITHUB_SHA" \
              --title "jpdict $VERSION_NAME" \
              --notes-file release-notes.md
          fi
