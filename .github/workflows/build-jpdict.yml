name: Build jpdict APK

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      stage:
        description: Release stage
        required: true
        default: B
        type: choice
        options:
          - A
          - D
          - B
          - T
          - C
          - R
          - P
          - H

permissions:
  contents: write

concurrency:
  group: jpdict-versioned-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Enforce tracked source size budget
        shell: bash
        run: |
          MAX_BYTES=$((35 * 1024 * 1024))
          TOTAL_BYTES=$(git ls-files -z | xargs -0 -r stat -c '%s' | awk '{sum += $1} END {print sum + 0}')
          echo "Tracked project size: $TOTAL_BYTES bytes / $MAX_BYTES bytes"
          if (( TOTAL_BYTES > MAX_BYTES )); then
            echo "::error::Tracked project files exceed the 35 MB hard limit."
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify floating search interaction state
        run: sh scripts/test-floating-search-state.sh

      - name: Verify OCR dwell, joystick and Latin filtering
        run: sh scripts/test-ocr-gesture-rules.sh

      - name: Verify independent MDX/MDD parser and query scheduler
        run: sh scripts/test-mdict.sh

      - name: Install Android command-line tools
        shell: bash
        run: |
          SDK="$RUNNER_TEMP/android-sdk"
          mkdir -p "$SDK/cmdline-tools"
          curl -fsSL -o /tmp/cmdline.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdline.zip -d "$SDK/cmdline-tools"
          mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set build version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_STAGE: ${{ github.event.inputs.stage || 'R' }}
        run: |
          python3 scripts/allocate-build-version.py \
            --date "$(TZ=Asia/Shanghai date +'%y.%m.%d')" \
            --stage "$BUILD_STAGE" \
            --run-number "$GITHUB_RUN_NUMBER"

      - name: Guard vivo system-bar compatibility
        shell: bash
        run: |
          if grep -R -n -E 'WindowInsetsController|getInsetsController\(' app/src/main/java; then
            echo "::error::Unsupported WindowInsetsController path reintroduced; this crashes QuickLookupActivity on the target vivo/OriginOS device."
            exit 1
          fi

      - name: Check Android compatibility with Lint
        run: >-
          gradle --no-daemon
          :app:lintArmDebug
          :app:lintArm64Debug
          :app:lintArmv7Debug

      - name: Detect release signing secrets
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -n "$KEYSTORE_B64" && -n "$STORE_PASS" && -n "$KEY_ALIAS" && -n "$KEY_PASS" ]]; then
            echo "HAS_SIGNING=true" >> "$GITHUB_ENV"
            echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/jpdict-release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/jpdict-release.jks" >> "$GITHUB_ENV"
          else
            echo "HAS_SIGNING=false" >> "$GITHUB_ENV"
            echo "::warning::Release signing secrets are not configured. Building debug artifacts only; no GitHub Release will be published."
          fi

      - name: Build signed Release APKs
        if: env.HAS_SIGNING == 'true'
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          gradle --no-daemon \
            :app:assembleArmRelease \
            :app:assembleArm64Release \
            :app:assembleArmv7Release

      - name: Build fallback debug APKs
        if: env.HAS_SIGNING != 'true'
        shell: bash
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          gradle --no-daemon \
            :app:assembleArmDebug \
            :app:assembleArm64Debug \
            :app:assembleArmv7Debug

      - name: Verify floating bubble configuration and history
        shell: bash
        run: |
          if [[ "$HAS_SIGNING" == 'true' ]]; then
            sh scripts/test-floating-bubble-config.sh arm64Release
          else
            sh scripts/test-floating-bubble-config.sh arm64Debug
          fi

      - name: Prepare signed APK files
        if: env.HAS_SIGNING == 'true'
        shell: bash
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/arm/release/app-arm-release.apk "dist/jpdict-${VERSION_NAME}-arm.apk"
          cp app/build/outputs/apk/arm64/release/app-arm64-release.apk "dist/jpdict-${VERSION_NAME}-arm64-v8a.apk"
          cp app/build/outputs/apk/armv7/release/app-armv7-release.apk "dist/jpdict-${VERSION_NAME}-armeabi-v7a.apk"

      - name: Prepare fallback debug APK files
        if: env.HAS_SIGNING != 'true'
        shell: bash
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/arm/debug/app-arm-debug.apk "dist/jpdict-${VERSION_NAME}-arm-UNSIGNED-DEBUG.apk"
          cp app/build/outputs/apk/arm64/debug/app-arm64-debug.apk "dist/jpdict-${VERSION_NAME}-arm64-v8a-UNSIGNED-DEBUG.apk"
          cp app/build/outputs/apk/armv7/debug/app-armv7-debug.apk "dist/jpdict-${VERSION_NAME}-armeabi-v7a-UNSIGNED-DEBUG.apk"

      - name: Enforce APK size budget
        shell: bash
        run: |
          MAX_BYTES=$((30 * 1024 * 1024))
          FAILED=0
          shopt -s nullglob
          APKS=(dist/*.apk)
          if (( ${#APKS[@]} == 0 )); then
            echo "::error::No APK files were prepared."
            exit 1
          fi
          for apk in "${APKS[@]}"; do
            SIZE=$(stat -c '%s' "$apk")
            echo "$(basename "$apk"): $SIZE bytes / $MAX_BYTES bytes"
            if (( SIZE > MAX_BYTES )); then
              echo "::error file=$apk::APK exceeds the 30 MiB hard limit."
              FAILED=1
            fi
          done
          exit "$FAILED"

      - name: Verify all offline OCR script models are packaged
        shell: bash
        run: |
          python3 - <<'PY'
          import glob
          import sys
          import zipfile

          required = (
              "Latn_ctc_cpu.binarypb",
              "Hani_ctc_cpu.binarypb",
              "Jpan_ctc_cpu.binarypb",
              "Kore_ctc_cpu.binarypb",
          )
          apks = sorted(glob.glob("dist/*.apk"))
          if not apks:
              sys.exit("No APK files were prepared for OCR model verification.")
          failed = False
          for apk in apks:
              with zipfile.ZipFile(apk) as package:
                  names = package.namelist()
              missing = [model for model in required if not any(name.endswith(model) for name in names)]
              if missing:
                  print(f"::error file={apk}::Missing bundled OCR script models: {', '.join(missing)}")
                  failed = True
              else:
                  print(f"{apk}: Latin, Chinese, Japanese, and Korean models are bundled.")
          if failed:
              sys.exit(1)
          PY

      - name: Verify release identity and signatures
        if: env.HAS_SIGNING == 'true'
        shell: bash
        run: |
          EXPECTED_CERT=cb8b97989bfe7894e796842ce5b2e3e3b2aab48aa7f0f7a97c1ece04ac184252
          PUBLIC_CERT=$(openssl x509 -in signing/jpdict-release-cert.pem -noout -fingerprint -sha256 | cut -d= -f2 | tr -d ':' | tr '[:upper:]' '[:lower:]')
          if [[ "$PUBLIC_CERT" != "$EXPECTED_CERT" ]]; then
            echo "::error::Public release certificate does not match the fixed signing identity."
            exit 1
          fi
          for apk in dist/*.apk; do
            SIGNATURE=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$apk")
            APK_CERT=$(sed -n 's/^Signer #[0-9][0-9]* certificate SHA-256 digest: //p' <<< "$SIGNATURE" | tr '[:upper:]' '[:lower:]')
            if [[ "$APK_CERT" != "$EXPECTED_CERT" ]]; then
              echo "::error file=$apk::APK is signed with a different release certificate."
              exit 1
            fi
            PACKAGE=$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | sed -n '/^package: /p')
            if [[ "$PACKAGE" != *"name='com.yuen.jpdict'"* || "$PACKAGE" != *"versionCode='$VERSION_CODE'"* || "$PACKAGE" != *"versionName='$VERSION_NAME'"* ]]; then
              echo "::error file=$apk::APK package/version does not match the allocated build version."
              exit 1
            fi
            echo "Verified $(basename "$apk"): $VERSION_NAME (versionCode=$VERSION_CODE), fixed release certificate."
          done

      - name: Create SHA-256 checksums
        shell: bash
        run: |
          sha256sum dist/*.apk | tee dist/SHA256SUMS.txt
          ls -lh dist/*.apk

      - name: Upload signed Actions artifact
        if: env.HAS_SIGNING == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: jpdict-signed-build-${{ github.run_number }}
          path: |
            dist/*.apk
            dist/SHA256SUMS.txt

      - name: Upload fallback debug artifact
        if: env.HAS_SIGNING != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: jpdict-unsigned-debug-build-${{ github.run_number }}
          path: |
            dist/*.apk
            dist/SHA256SUMS.txt

      - name: Create Release notes
        if: env.HAS_SIGNING == 'true'
        shell: bash
        run: |
          {
            echo "## 版本"
            echo
            echo "- Version: \`$VERSION_NAME\`"
            echo "- versionCode: \`$VERSION_CODE\`"
            echo "- 固定签名证书 SHA-256: \`CB:8B:97:98:9B:FE:78:94:E7:96:84:2C:E5:B2:E3:E3:B2:AA:B4:8A:A7:F0:F7:A9:7C:1E:CE:04:AC:18:42:52\`"
            echo
            cat docs/release-notes.md
          } > release-notes.md

      - name: Publish signed GitHub Release
        if: env.HAS_SIGNING == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="$VERSION_NAME"

          publish_release() {
            if gh release view "$TAG" >/dev/null 2>&1; then
              gh release upload "$TAG" \
                dist/*.apk \
                dist/SHA256SUMS.txt \
                --clobber || return 1
            else
              gh release create "$TAG" \
                dist/*.apk \
                dist/SHA256SUMS.txt \
                --target "$GITHUB_SHA" \
                --title "jpdict $VERSION_NAME" \
                --notes-file release-notes.md || return 1
            fi

            gh release edit "$TAG" \
              --title "jpdict $VERSION_NAME" \
              --notes-file release-notes.md \
              --draft=false --latest || return 1

            gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" > dist/published-release.json || return 1
            python3 - <<'PY'
          import json, os
          from pathlib import Path
          release = json.loads(Path("dist/published-release.json").read_text())
          version = os.environ["VERSION_NAME"]
          expected = {f"jpdict-{version}-{abi}.apk" for abi in ("arm", "arm64-v8a", "armeabi-v7a")}
          expected.add("SHA256SUMS.txt")
          assets = release.get("assets", [])
          valid = (release.get("draft") is False and release.get("prerelease") is False
                   and release.get("tag_name") == version
                   and release.get("target_commitish") == os.environ["GITHUB_SHA"]
                   and {asset["name"] for asset in assets} == expected
                   and all(asset.get("state") == "uploaded" and asset.get("size", 0) > 0 for asset in assets))
          if not valid:
              raise SystemExit("Release is not fully published for this build")
          print(release["html_url"])
          PY
          }

          for attempt in 1 2 3; do
            if publish_release; then
              exit 0
            fi
            echo "::warning::Release publication attempt $attempt failed."
            if (( attempt < 3 )); then sleep $((attempt * 5)); fi
          done
          echo "::error::Signed APKs were built, but the Release was not published completely."
          exit 1
